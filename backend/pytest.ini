[pytest]
testpaths = tests
# Import app packages (api, generation, retrieval, ...) from backend/ no matter
# how pytest is invoked — plain `pytest` does not add the cwd to sys.path.
pythonpath = .
markers =
    integration: needs live Qdrant/Redis (docker compose up -d) — run with: pytest -m integration
addopts = -m "not integration"
