# CodeSense infrastructure — Qdrant (vector DB) + Redis (cache + Celery broker).
# The FastAPI backend and Celery worker run outside Docker (see README) so
# the embedding model/torch can use the host's CPU/GPU directly without extra
# image bloat.
#
# Usage: docker compose up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: codesense_qdrant
    ports:
      # Bound to localhost only — the local Docker instance has no API key.
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: codesense_redis
    ports:
      # Host port follows REDIS_PORT from .env (docker compose reads .env
      # automatically), defaulting to 6379. Bound to localhost only — this
      # Redis has no password (see docker/redis/redis.conf).
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
