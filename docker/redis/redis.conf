# CodeSense Redis config — used for the embedding cache and as the Celery
# broker/result backend. Persistence is enabled so the embedding cache
# survives container restarts (avoids re-embedding unchanged files).

bind 0.0.0.0
port 6379
protected-mode no

# Persistence: RDB snapshotting is enough here — embedding cache entries
# are recomputable, so we don't need AOF's stronger durability guarantees.
save 300 10
save 60 1000
dir /data

# Evict least-recently-used keys once memory fills, rather than erroring —
# the embedding cache is fine to lose entries under pressure.
maxmemory 512mb
maxmemory-policy allkeys-lru
